{{PHEAD}}

  <section class="sub-sec">
    <div class="fx" data-fx="sub" aria-hidden="true"></div>
    <div class="inner">
      <p class="phead__lead rv" style="margin:0 auto 34rem;text-align:center">個性ゆたかなサキュバスのナースたちが、患者さまをお出迎えします♡<br>カードを押すと、カルテ（プロフィール）が見られます。</p>
      <div class="tabs ctabs rv" id="cast-tabs" role="tablist" aria-label="期生で絞り込む">{{CASTTABS}}</div>
      <div class="ctool glass rv">
        <label class="ctool__search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5L18 18"/></svg><input type="search" id="cast-q" placeholder="名前でさがす" aria-label="ナースを名前でさがす" autocomplete="off"></label>
        <p class="ctool__count mono"><b id="cast-count">{{CASTN}}</b> / {{CASTN}} NURSES</p>
      </div>
      <ul class="croster" id="croster">
{{CAST}}
      </ul>
      {{CASTDATA}}
      <p class="empty" id="cast-empty" hidden>条件に合うナースは見つかりませんでした。</p>
    </div>
  </section>

  <section class="sub-sec">
    <div class="inner">
      <div class="sub-h rv"><b class="grad-text">GALLERY</b><span>集合写真（{{PHOTON}}枚）</span><i></i></div>
      <ul class="gallery" id="gallery">
{{GALLERY}}
      </ul>
    </div>
  </section>


{{OUT}}
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="集合写真" hidden>
    <div class="lightbox__bg" data-lb-close></div>
    <figure class="lightbox__fig"><img id="lb-img" src="" alt=""><figcaption class="mono" id="lb-cap"></figcaption></figure>
    <button class="lightbox__close" type="button" data-lb-close aria-label="閉じる"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
    <button class="lightbox__nav --prev" type="button" id="lb-prev" aria-label="前の写真"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3L5 7l4 4"/></svg></button>
    <button class="lightbox__nav --next" type="button" id="lb-next" aria-label="次の写真"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l4 4-4 4"/></svg></button>
  </div>
<div class="cmodal" id="cmodal" role="dialog" aria-modal="true" aria-labelledby="cm-name" hidden>
  <div class="cmodal__bg" data-cm-close></div>
  <div class="cmodal__box" id="cm-box">
    <figure class="cmodal__ph"><img id="cm-img" src="" alt=""><span class="cmodal__scan" aria-hidden="true"></span></figure>
    <div class="cmodal__info">
      <p class="cm-no mono" id="cm-no">No.01</p>
      <p class="cm-catch" id="cm-catch"></p>
      <h2 class="cm-name" id="cm-name"></h2>
      <p class="cm-tags" id="cm-tags"></p>
      <dl class="spec cm-spec" id="cm-spec"></dl>
      <p class="cm-empty" id="cm-empty" hidden>カルテは準備中です。公開まで、もう少しお待ちください♡</p>
      <div class="cm-nav">
        <button class="arr" type="button" id="cm-prev" aria-label="前のナース"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3L5 7l4 4"/></svg></button>
        <span class="mono" id="cm-pos">01 / 60</span>
        <button class="arr" type="button" id="cm-next" aria-label="次のナース"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l4 4-4 4"/></svg></button>
      </div>
    </div>
    <button class="cmodal__close" type="button" data-cm-close aria-label="閉じる"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button>
  </div>
</div>
{{/OUT}}

  {{BACK}}
